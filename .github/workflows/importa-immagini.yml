name: Importa immagini dal sito attuale

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scarica le immagini
        run: bash scripts/scarica-immagini.sh
      - name: Salva nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img
          git diff --cached --quiet || git commit -m "Importa immagini da toffenetti.it"
          git push
